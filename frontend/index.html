<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Just+Another+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css" />
</head>
<body>
    <main id = "board" class = "board-frame">
        <div class="header-tag"><h1>Example's Hearth</h1></div>
        <div class="sticky-note note-green" style="top:7%; left:62%"><h1>10/26</h1></div>
        <div class="sticky-note note-orange" style="top: 20%; left: 15%;"></div>
        <div class="sticky-note note-yellorange" style="top: 65%; left: 35%;"></div>
        <div class="sticky-note note-blue"   style="top: 25%; right: 12%;"></div>
    </main>

    <dialog>
        <div class="pin pin-red"></div>
        <section id="view-welcome" class="modal-view">
            <h1 class="paper-title">Welcome to Hearth!</h1>
            <p class="paper-subtitle">hearth is shared productivity made fun and simple!</p>
            <div class="button-row">
                <button type="button" id="btn-goto-login" class="pill-btn">login</button>
                <button type="button" id="btn-goto-signup" class="pill-btn">sign up</button>
            </div>
        </section>

        <section id="view-login" class="modal-view" hidden>
          <h2 class="paper-title">Login:</h2>
          <form id="form-login" class="auth-form">
            <label for="login-email">email:</label>
            <input type="email" id="login-email" name="email" required autocomplete="email" />

            <label for="login-password">password:</label>
            <input type="password" id="login-password" name="password" required autocomplete="current-password" />

            <button type="submit" class="pill-btn submit-btn">enter</button>
          </form>
        </section>
        <section id="view-welcome-back" class="modal-view" hidden>
          <h2 class="paper-title">Welcome Back <span id="user-display-name">[NAME]</span>!</h2>
          <button type="button" id="btn-enter-hearth" class="pill-btn wide-btn">Enter Your Hearth</button>
        </section>
    </dialog>

    <script src="js/app.js"></script>

</body>
</html>
