[project]
name = "hearth"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "certifi",
    "fastapi>=0.146.0",
    "pydantic-settings",
    "pymongo>=4.11,<5",
    "PyJWT>=2.10,<3",
    "pydantic[email]>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"